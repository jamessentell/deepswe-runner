[project]
name = "deepswe-copilot-runner"
version = "0.1.0"
description = "Run DeepSWE Bench with GitHub Copilot models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datacurve-pier==0.3.0",
]

[project.scripts]
deepswe = "deepswe_runner.cli:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "deepswe_runner"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
